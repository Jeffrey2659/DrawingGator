[gwrite]
default_profile = "grbl"

[gwrite.grbl]
unit = "inch"
document_start = "G20\nG90\nG92 X0 Y0 I1 J5\nM3 S70\n"
layer_start = ""

# Travel move (pen up), then lower pen at destination
segment_first = "M3 S70\nG00 X{x:.4f} Y{y:.4f}\nM3 S250\n"

# Continue drawing (pen already down)
segment = "G01 X{x:.4f} Y{y:.4f}\n"

layer_end = ""
document_end = "M3 S70\nM5\nM2\n"
info = "GRBL profile without feed rate"
